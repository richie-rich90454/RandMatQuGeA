# The wrapper jar and the distribution it downloads are both pinned by checksum.
#
# An IDE warns that gradle-wrapper.jar "could be malicious" whenever the jar's bytes
# differ from the one it has trusted before, which is what happened when this
# project moved from Gradle 8.14.3 to 9.8.0. The jar here was produced by Gradle's
# own `wrapper` task from the official distribution rather than assembled by hand,
# and it is byte-identical to the one Gradle publishes:
#
#   gradle-wrapper.jar  sha256 238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5
#                       from https://services.gradle.org/distributions/gradle-9.8.0-wrapper.jar.sha256
#
# distributionSha256Sum below is that check made permanent: the wrapper refuses to
# unpack a distribution whose bytes do not match, so a tampered mirror cannot be
# built from even though the URL is correct.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
distributionSha256Sum=bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
