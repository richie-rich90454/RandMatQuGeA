[package]
name = "random_math_question_generator"
version = "3.0.0"
description = "Random math question generator made with HTML, CSS, and JS."
authors = ["richie-rich90454"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "^2", features = ["tray-icon", "image-png"] }
tauri-utils = { version = "^2", features = [] }
tauri-plugin-shell = "^2"
tauri-plugin-updater = { version = "2.10.0" }
tauri-plugin-process = "2.3.1"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
anyhow = "1.0"
thiserror = "1.0"
derive_more = { version = "1.0", features = ["full"] }
strum = "0.26"
strum_macros = "0.26"
rand = "0.9"
printpdf = { version = "0.7", features = ["embedded_images"] }
tauri-plugin-dialog = "2"
# Pure-Rust KaTeX-compatible LaTeX math rendering. Used to rasterize each
# math expression to a PNG which is then embedded in the worksheet PDF,
# giving perfect LaTeX rendering (fractions, matrices, integrals, etc.)
# without any JavaScript runtime or WebView.
ratex-parser = "0.1"
ratex-layout = "0.1"
ratex-types = "0.1"
ratex-render = { version = "0.1", features = ["embed-fonts"] }
image = { version = "0.24", default-features = false, features = ["png"] }

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]
name = "random_math_question_generator"

[[bin]]
name = "randmatqugea"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
