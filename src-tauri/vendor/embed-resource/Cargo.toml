[package]
edition = "2021"
name = "embed-resource"
version = "3.0.9"
authors = ["vendored: build script patched for sandbox compatibility"]
build = false
description = "A Cargo library to handle compilation and inclusion of Windows resources (vendored: rustc_version subprocess call removed)"
license = "MIT"

[lib]
name = "embed_resource"
path = "src/lib.rs"

[[bin]]
name = "embed-resource"
path = "src/main.rs"

[dependencies.toml]
version = "1"

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies.cc]
version = "1.2"

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies.vswhom]
version = "0.1"

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies.winreg]
version = "0.55"
default-features = false

[target.'cfg(not(target_os = "windows"))'.dependencies.cc]
version = "1.2"

[target.'cfg(not(target_os = "windows"))'.dependencies.memchr]
version = "2.7"
