name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type-check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: TypeScript type-check
        run: npm run build:typescript
      - name: Tests
        run: npm run test:run