name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type-check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: TypeScript type-check
        run: npm run build:typescript
      - name: Tests
        run: npm run test:run
      - name: Build web bundle
        run: npm run build:web
      - name: Bundle budget check
        run: npm run bundle:check
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        # The desktop and mobile-chrome projects use the bundled Chromium, and the
        # mobile-safari project's iPhone descriptor runs on WebKit, so both
        # engines are needed.
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests
        run: npm run test:e2e
  oracle:
    name: Symbolic generator oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Generator correctness oracle
        run: npm run test:oracle