name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type-check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: TypeScript type-check
        run: npm run build:typescript
      - name: Tests
        run: npm run test:run
      - name: Build web bundle
        run: npm run build:web
      - name: Bundle budget check
        run: npm run bundle:check
      - name: Install Linux system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            gpg \
            libappindicator3-dev || sudo apt --fix-broken install -y
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
  oracle:
    name: Generator correctness oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Generator correctness oracle
        run: npm run test:oracle
  windows:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Install NSIS
        run: choco install nsis -y
      # The default flavour downloads a WebView2 bootstrapper at install time,
      # which is what a machine with no outbound network cannot do, so the fixed
      # runtime flavour is the one that gets built and smoke tested.
      - name: Build the fixed-runtime installer
        run: npm run tauri:fixed -- --ci
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: randmatqugea-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error